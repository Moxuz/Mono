# ─────────────────────────────────────────────────────────────────────────────
# Auth Monolith - Complete Stack with Kafka + Nginx reverse proxy
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   Start:     docker-compose up -d
#   Stop:      docker-compose down
#   Rebuild:   docker-compose up -d --build
#   Logs:      docker-compose logs -f
#
# Traffic entry point: http://localhost (port 80 via Nginx)
# Direct app access:   NOT exposed (internal only — accessed through nginx)
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared app environment ─────────────────────────────────────────────────────
# Using YAML anchors to keep the app service definition compact
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 5000
  MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}@mongodb:27017/authdb?authSource=admin
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # Callback URLs now point to the Nginx load balancer (port 80, no explicit port)
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost/api/auth/github/callback}
  BASE_URL: ${BASE_URL:-http://localhost}
  AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://localhost}
  TRUST_PROXY: "1"
  USE_REDIS_SESSIONS: ${USE_REDIS_SESSIONS:-true}
  REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
  # Kafka
  USE_KAFKA_LOGGING: ${USE_KAFKA_LOGGING:-false}
  KAFKA_BROKER: kafka:29092
  KAFKA_CLIENT_ID: auth-app
  KAFKA_CONNECT_TIMEOUT_MS: ${KAFKA_CONNECT_TIMEOUT_MS:-3000}
  KAFKA_RETRIES: ${KAFKA_RETRIES:-3}
  # Rate limit whitelist — includes Nginx container IPs so health probes are not throttled
  RATE_LIMIT_WHITELIST: "127.0.0.1,::ffff:127.0.0.1,::1,172.19.0.1,::ffff:172.19.0.1,172.22.0.1,::ffff:172.22.0.1,172.25.0.1,::ffff:172.25.0.1,172.26.0.1,::ffff:172.26.0.1,172.27.0.1,::ffff:172.27.0.1"

x-app-depends: &app-depends
  mongodb:
    condition: service_healthy
  redis:
    condition: service_healthy

x-app-base: &app-base
  build: .
  env_file:
    - .env
  environment:
    <<: *app-env
  depends_on:
    <<: *app-depends
  networks:
    - auth-network
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  # ─── Nginx Load Balancer ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: auth-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-app-1:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped

  # ─── App Instance 1 ────────────────────────────────────────────────────────
  auth-app-1:
    <<: *app-base
    container_name: auth-app-1
    environment:
      <<: *app-env
      INSTANCE_ID: "1"
      KAFKA_CLIENT_ID: auth-app-1

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.2
    container_name: auth-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: authdb
    volumes:
      - mongo-data:/data/db
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Zookeeper (Required by Kafka) ─────────────────────────────────────────
  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ──────────────────────────────────────────────────────────
  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 30s
      timeout: 10s
      retries: 5


networks:
  auth-network:
    name: ${AUTH_NETWORK_NAME:-auth-network}
    driver: bridge
  client-network:
    name: ${CLIENT_NETWORK_NAME:-client-network}
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
