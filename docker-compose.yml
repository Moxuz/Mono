version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: auth-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=authdb
    volumes:
      - mongo-data:/data/db
    networks:
      - auth-network
    restart: unless-stopped

  app:
    build: .
    container_name: auth-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017/authdb?authSource=admin
      - JWT_SECRET=your_secret_key_123456
      - SESSION_SECRET=your_session_secret_123456
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - auth-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  auth-network:
    driver: bridge