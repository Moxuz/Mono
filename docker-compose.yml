# ─────────────────────────────────────────────────────────────────────────────
# Auth Monolith - Complete Stack with Kafka + Nginx Load Balancer
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   Start:     docker-compose up -d
#   Stop:      docker-compose down
#   Rebuild:   docker-compose up -d --build
#   Logs:      docker-compose logs -f
#   Scale app: docker-compose up -d --scale auth-app-1=1 (handled by named services)
#
# Traffic entry point: http://localhost (port 80 via Nginx)
# Direct app access:   NOT exposed (internal only — accessed through nginx)
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

# ── Shared app environment ─────────────────────────────────────────────────────
# Using YAML anchors to DRY the three identical app service definitions
x-app-env: &app-env
  NODE_ENV: development
  PORT: 5000
  MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/authdb?authSource=admin
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # Callback URLs now point to the Nginx load balancer (port 80, no explicit port)
  GOOGLE_CALLBACK_URL: http://localhost/api/auth/google/callback
  GITHUB_CALLBACK_URL: http://localhost/api/auth/github/callback
  BASE_URL: http://localhost
  AUTH_SERVER_URL: http://localhost
  # Kafka
  USE_KAFKA_LOGGING: "true"
  KAFKA_BROKER: kafka:29092
  KAFKA_CLIENT_ID: auth-app
  # Rate limit whitelist — includes Nginx container IPs so health probes are not throttled
  RATE_LIMIT_WHITELIST: "127.0.0.1,::ffff:127.0.0.1,::1,172.22.0.1,::ffff:172.22.0.1,172.25.0.1,::ffff:172.25.0.1,172.26.0.1,::ffff:172.26.0.1,172.27.0.1,::ffff:172.27.0.1"

x-app-depends: &app-depends
  mongodb:
    condition: service_started
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-app-base: &app-base
  build: .
  env_file:
    - .env
  environment:
    <<: *app-env
  depends_on:
    <<: *app-depends
  networks:
    - auth-network
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  # ─── Nginx Load Balancer ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: auth-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-app-1:
        condition: service_healthy
      auth-app-2:
        condition: service_healthy
      auth-app-3:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped

  # ─── App Instance 1 ────────────────────────────────────────────────────────
  auth-app-1:
    <<: *app-base
    container_name: auth-app-1
    environment:
      <<: *app-env
      INSTANCE_ID: "1"
      KAFKA_CLIENT_ID: auth-app-1

  # ─── App Instance 2 ────────────────────────────────────────────────────────
  auth-app-2:
    <<: *app-base
    container_name: auth-app-2
    environment:
      <<: *app-env
      INSTANCE_ID: "2"
      KAFKA_CLIENT_ID: auth-app-2

  # ─── App Instance 3 ────────────────────────────────────────────────────────
  auth-app-3:
    <<: *app-base
    container_name: auth-app-3
    environment:
      <<: *app-env
      INSTANCE_ID: "3"
      KAFKA_CLIENT_ID: auth-app-3

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: auth-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=authdb
    volumes:
      - mongo-data:/data/db
    networks:
      - auth-network
    restart: unless-stopped

  # ─── Zookeeper (Required by Kafka) ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Kafka UI (Web Interface) ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: auth-app-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - auth-network
    restart: unless-stopped
    volumes:
      - kafka-ui-config:/etc/kafkaui

networks:
  auth-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  kafka-ui-config:
