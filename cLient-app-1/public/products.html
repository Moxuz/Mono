<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - ShopHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">🛒 ShopHub</a>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/products">Products</a>
            <a href="/profile">Profile</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2 style="margin-bottom:20px;">🛍️ Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="product-img" style="background:#eff6ff;">📱</div>
                <div class="product-info">
                    <h3>Smartphone</h3>
                    <p>\$599</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-img" style="background:#f0fdf4;">💻</div>
                <div class="product-info">
                    <h3>Laptop</h3>
                    <p>\$999</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-img" style="background:#fefce8;">🎧</div>
                <div class="product-info">
                    <h3>Headphones</h3>
                    <p>\$199</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cookie Banner -->
    <div id="cookieBanner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
        <div class="cookie-banner-content">
            <div class="cookie-banner-text">
                <span class="cookie-icon">🍪</span>
                <div>
                    <strong>We use cookies</strong>
                    <p>
                        Essential cookies keep you signed in.
                        Read our <a href="http://localhost:5000/privacy-policy.html" target="_blank">Privacy Policy</a>.
                    </p>
                </div>
            </div>
            <div class="cookie-banner-actions">
                <button class="btn-cookie-decline" onclick="handleCookieConsent(false)">Essential Only</button>
                <button class="btn-cookie-accept"  onclick="handleCookieConsent(true)">Accept All</button>
            </div>
        </div>
    </div>
    <script src="/js/silent-auth.js"></script> 
    <script src="/js/products.js"></script>
    <script src="/js/cookie-banner.js"></script>
</body>
</html>
