<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub</title>
    <style>
        /* index มี style เฉพาะตัว */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .container {
            background: white; border-radius: 20px;
            padding: 60px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center; max-width: 500px;
        }
        h1         { font-size: 3rem; margin-bottom: 1rem; }
        .tagline   { color: #64748b; font-size: 1.25rem; margin-bottom: 2rem; }
        .features  {
            text-align: left; margin: 2rem 0;
            padding: 1.5rem; background: #f8fafc; border-radius: 12px;
        }
        .features li { margin: 0.75rem 0; color: #475569; }
        .btn {
            display: inline-block; padding: 15px 40px;
            background: #3b82f6; color: white; text-decoration: none;
            border-radius: 50px; font-size: 1.1rem; font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s; margin: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(59,130,246,0.3); }
        .btn-secondary { background: #64748b; }
        .status {
            margin-top: 2rem; padding: 1rem;
            background: #e7f3ff; border-radius: 8px; color: #0066cc;
        }
    </style>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🛒 ShopHub</h1>
        <p class="tagline">Your Premium E-commerce Platform</p>

        <div class="features">
            <h3>✨ Features:</h3>
            <ul>
                <li>🔐 Secure OAuth 2.0 Login</li>
                <li>🛍️ Browse Products</li>
                <li>👤 User Profile</li>
                <li>🔒 Protected Routes</li>
            </ul>
        </div>

        <a href="/login" class="btn">🚀 Login with SSO</a>

        <div class="status" id="status">
            <p>📍 Status: Checking...</p>
        </div>
    </div>

    <!-- Cookie Banner -->
    <div id="cookieBanner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
        <div class="cookie-banner-content">
            <div class="cookie-banner-text">
                <span class="cookie-icon">🍪</span>
                <div>
                    <strong>We use cookies</strong>
                    <p>
                        Essential cookies keep you signed in.
                        Read our <a href="http://localhost:5000/privacy-policy.html" target="_blank">Privacy Policy</a>.
                    </p>
                </div>
            </div>
            <div class="cookie-banner-actions">
                <button class="btn-cookie-decline" onclick="handleCookieConsent(false)">Essential Only</button>
                <button class="btn-cookie-accept"  onclick="handleCookieConsent(true)">Accept All</button>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/session')
            .then(r => r.json())
            .then(data => {
                const status = document.getElementById('status');
                if (data.authenticated) {
                    status.innerHTML = `
                        <p>✅ Logged in as: <strong>${data.user.username}</strong></p>
                        <p style="margin-top:8px;">
                            <a href="/dashboard" style="color:#0066cc;">Go to Dashboard →</a>
                        </p>
                    `;
                } else {
                    status.innerHTML = `<p>📍 Status: Not logged in</p>`;
                }
            })
            .catch(() => {});
    </script>
    <script src="/js/cookie-banner.js"></script>
</body>
</html>
