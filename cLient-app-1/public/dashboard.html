<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ShopHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">🛒 ShopHub</a>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/products">Products</a>
            <a href="/profile">Profile</a>
            <form method="post" action="/logout"><button type="submit">Logout</button></form>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="welcomeCard">
            <p>Loading...</p>
        </div>

        <div class="card">
            <h3>Quick Links</h3>
            <a href="/products" class="btn">🛍️ Products</a>
            <a href="/profile"  class="btn btn-secondary">👤 Profile</a>
            <form method="post" action="/logout"><button type="submit" class="btn btn-danger">Logout</button></form>
        </div>
    </div>
  
    <!-- Cookie Banner -->
    <div id="cookieBanner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
        <div class="cookie-banner-content">
            <div class="cookie-banner-text">
                <span class="cookie-icon">🍪</span>
                <div>
                    <strong>We use cookies</strong>
                    <p>
                        Essential cookies keep you signed in.
                        Read our <a href="/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
                    </p>
                </div>
            </div>
            <div class="cookie-banner-actions">
                <button class="btn-cookie-decline" data-cookie-consent="reject">Reject non-essential</button>
                <button class="btn-cookie-accept"  data-cookie-consent="accept">Accept all</button>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
    <script src="/js/cookie-banner.js"></script>
</body>
</html>
