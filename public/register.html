<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — AuthSys</title>
     <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Account</h1>
                <p>Create a new operator identity.</p>
            </div>

            <!-- Alert (Hidden by default) -->
            <div id="alert" class="alert" style="display: none;"></div>

            <form id="registerForm" class="auth-form" method="post" action="/api/auth/register" novalidate>
                <div class="form-group">
                    <label for="username" class="input-label">Username</label>
                    <input type="text" id="username" name="username" class="input" placeholder="operator_name" autocomplete="username" minlength="3" maxlength="64" required />
                </div>

                <div class="form-group">
                    <label for="email" class="input-label">Email Address</label>
                    <input type="email" id="email" name="email" class="input" placeholder="you@example.com" autocomplete="email" maxlength="254" required />
                </div>

                <div class="form-group">
                    <label for="password" class="input-label">Master Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="input" placeholder="••••••••" autocomplete="new-password" minlength="8" maxlength="128" required />
                        <button type="button" class="password-toggle" data-input="password" data-icon="passwordIcon" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined" id="passwordIcon">visibility</span>
                        </button>
                    </div>
                    <div class="password-strength-container">
                        <div class="strength-bar" id="strengthBar">
                            <div class="strength-bar-fill" id="strengthBarFill"></div>
                        </div>
                        <div class="strength-text" id="strengthText">Enter password...</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="input-label">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="input" placeholder="••••••••" autocomplete="new-password" minlength="8" maxlength="128" required />
                        <button type="button" class="password-toggle" data-input="confirmPassword" data-icon="confirmPasswordIcon" aria-label="Toggle confirm password visibility">
                            <span class="material-symbols-outlined" id="confirmPasswordIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="consentEssential" name="consentEssential" required />
                        <span><strong>Required:</strong> I agree to the <a href="/privacy-policy.html#terms">Terms of Service</a> and acknowledge the <a href="/privacy-policy.html#section-1">Privacy Notice</a>.</span>
                    </label>
                </div>

                <!-- ✅ ลบไอคอน person_add ออก -->
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                    <span>CREATE ACCOUNT</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already provisioned? <a href="/login.html">Sign in</a></p>
            </div>
        </div>
    </div>

      <div id="cookieBanner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
        <div class="cookie-banner-content">
            <div class="cookie-banner-text">
                <span class="cookie-icon">🍪</span>
                <div>
                    <strong>Privacy choices</strong>
                    <p>Essential cookies keep sign-in and security working. Analytics is optional. <a href="/privacy-policy.html" target="_blank" rel="noopener noreferrer">Read Terms & Privacy</a>.</p>
                </div>
            </div>
            <div class="cookie-banner-actions">
                <button class="btn-cookie-decline" type="button">Reject non-essential</button>
                <button class="btn-cookie-accept" type="button">Accept all</button>
            </div>
        </div>
    </div>
    
    <script src="/js/register.js"></script>
        <script src="/js/cookie-banner.js"></script>
</body>
</html>
