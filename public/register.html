<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Auth System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🚀 Create Account</h1>
                <p>Sign up to get started</p>
            </div>

            <div id="alert" class="alert" style="display: none;"></div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="johndoe"
                        required
                        minlength="3"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Min 8 characters"
                        required
                        minlength="8"
                    >
                    <small class="form-hint">At least 8 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Re-enter password"
                        required
                    >
                </div>

             

                <!-- ✅ PDPA Consent Box -->
<div class="consent-box">
    <div class="consent-box-header">
        🔒 ความยินยอมในการใช้ข้อมูลส่วนบุคคล
        <span style="font-size:0.78rem; color:#64748b; font-weight:400;">
            (Personal Data Consent)
        </span>
    </div>

    <!-- Consent 1: Essential (Required) -->
    <div class="consent-item consent-item-required">
        <label class="checkbox">
            <input type="checkbox" name="consentEssential" id="consentEssential" required>
            <span>
                <strong>การใช้งานระบบ (Essential)</strong>
                <span class="badge-required">จำเป็น / Required</span>
                <br>
                <small>
                    ยินยอมให้เก็บข้อมูลที่จำเป็นสำหรับการให้บริการ เช่น
                    ชื่อผู้ใช้ อีเมล และรหัสผ่าน (เข้ารหัส)
                    รวมถึงยอมรับ
                    <a href="/privacy-policy.html" target="_blank" class="link">
                        นโยบายความเป็นส่วนตัวและเงื่อนไขการใช้งาน
                    </a>
                    <br>
                    <em>
                        Consent to collect essential data (username, email, password)
                        and agree to our
                        <a href="/privacy-policy.html" target="_blank" class="link">
                            Privacy Policy &amp; Terms of Service
                        </a>.
                    </em>
                </small>
            </span>
        </label>
    </div>

    <!-- Consent 2: Analytics (Optional) -->
    <div class="consent-item">
        <label class="checkbox">
            <input type="checkbox" name="consentAnalytics" id="consentAnalytics">
            <span>
                <strong>การปรับปรุงบริการ (Analytics)</strong>
                <span class="badge-optional">ไม่บังคับ / Optional</span>
                <br>
                <small>
                    ยินยอมให้เก็บข้อมูลการใช้งาน เช่น
                    เวลาเข้าสู่ระบบ ประเภทเบราว์เซอร์
                    เพื่อวิเคราะห์และปรับปรุงคุณภาพบริการ
                    <br>
                    <em>Consent to collect usage data (login time, browser type)
                    to improve service quality.</em>
                </small>
            </span>
        </label>
    </div>


                    <p class="consent-policy-link">
                        อ่านนโยบายความเป็นส่วนตัวฉบับเต็มได้ที่
                        <a href="/privacy-policy.html" target="_blank" class="link">
                            นโยบายความเป็นส่วนตัว / Privacy Policy
                        </a>
                    </p>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Create Account
                </button>
            </form>

            <div class="divider"><span>OR</span></div>

            <button class="btn btn-google btn-block" onclick="registerWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                    <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
                    <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
                    <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
                </svg>
                Sign up with Google
            </button>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html" class="link">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="/js/register.js"></script>
    <script src="/js/cookie-banner.js"></script>
</body>
</html>
