<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuthSys Admin · Users</title>
    <style>
        :root { color-scheme: dark; --bg:#0b1020; --panel:#151d32; --line:#2b3958; --text:#f8fafc; --muted:#9aa8c2; --accent:#67e8f9; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; color:var(--text); font:14px/1.5 Inter,system-ui,sans-serif; background:var(--bg); }
        .shell { width:min(1180px,calc(100% - 32px)); margin:auto; }
        header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:24px 0; border-bottom:1px solid var(--line); }
        a { color:var(--accent); text-decoration:none; }
        button { border:1px solid var(--line); border-radius:9px; padding:8px 12px; color:var(--text); background:#1d2945; cursor:pointer; }
        main { padding:28px 0 60px; }
        h1 { margin:0 0 6px; font-size:2rem; }
        p { color:var(--muted); }
        .panel { overflow:auto; margin-top:22px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
        table { width:100%; border-collapse:collapse; min-width:720px; }
        th,td { padding:13px 16px; text-align:left; border-bottom:1px solid var(--line); }
        th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
        tr:last-child td { border-bottom:0; }
        .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; background:#334155; }
        .active { color:#86efac; background:#14532d; }
        .inactive { color:#fda4af; background:#4c1d2b; }
        .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:20px; }
        #message { color:var(--muted); }
        .pagination { display:flex; align-items:center; gap:12px; }
        @media (max-width:620px) { header,.toolbar { align-items:flex-start; flex-direction:column; } }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <div><a href="/admin.html">← Admin console</a><h1>User database</h1><p>Registered users and account status from AuthSys.</p></div>
            <button id="logout" type="button">Sign out</button>
        </header>
        <main>
            <div id="message">Checking administrator access…</div>
            <section id="content" style="display:none">
                <div class="toolbar"><span id="summary"></span><button id="refresh" type="button">Refresh</button></div>
                <div class="panel">
                    <table>
                        <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Last login</th></tr></thead>
                        <tbody id="users"></tbody>
                    </table>
                </div>
                <div class="toolbar">
                    <span id="pageInfo"></span>
                    <div class="pagination"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/auth-refresh.js"></script>
    <script src="/js/admin-users.js"></script>
</body>
</html>
