<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AuthSys Admin · Security logs</title>
    <style>
        :root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--line:#2b3958;--text:#f8fafc;--muted:#9aa8c2;--accent:#67e8f9;--good:#86efac;--bad:#fda4af}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg)}a{color:var(--accent);text-decoration:none}.shell{width:min(1240px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid var(--line)}h1{margin:.25rem 0}.muted,#message{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.stat,.filters,.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat{padding:16px}.stat strong{display:block;font-size:1.6rem}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}.filters label{display:grid;gap:5px;color:var(--muted)}select,input,button{border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text);background:#1d2945}button{cursor:pointer}.actions{display:flex;align-items:end;gap:8px}.panel{overflow:auto;margin-top:16px}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#334155}.success{color:var(--good)}.failure{color:var(--bad)}.footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0 50px}.footer div{display:flex;gap:8px}.details{max-width:300px;overflow-wrap:anywhere}@media(max-width:800px){.stats,.filters{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.filters{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="shell">
        <header><a href="/admin">← Admin console</a><h1>Security audit logs</h1><p class="muted">Login, consent, token and account-security events.</p></header>
        <main>
            <section class="stats" aria-label="Last 24 hours">
                <div class="stat"><span>Login attempts</span><strong id="totalEvents">—</strong></div>
                <div class="stat"><span>Successful</span><strong id="successEvents">—</strong></div>
                <div class="stat"><span>Failed</span><strong id="failedEvents">—</strong></div>
                <div class="stat"><span>Lockouts</span><strong id="lockedAccounts">—</strong></div>
            </section>
            <section class="filters" aria-label="Log filters">
                <label>Action<select id="filterAction"><option value="">All actions</option><option>login_success</option><option>login_failed</option><option>logout</option><option>consent_granted</option><option>consent_denied</option><option>consent_revoked</option><option>password_changed</option><option>account_locked</option></select></label>
                <label>Status<select id="filterStatus"><option value="">All statuses</option><option value="success">Success</option><option value="failure">Failure</option></select></label>
                <label>Start date<input type="date" id="filterStartDate"></label>
                <label>End date<input type="date" id="filterEndDate"></label>
                <div class="actions"><button id="applyFilters" type="button">Apply</button><button id="exportLogs" type="button">Export CSV</button></div>
            </section>
            <p id="message" role="status">Loading logs…</p>
            <section class="panel">
                <table>
                    <thead><tr><th>Timestamp</th><th>Action</th><th>Status</th><th>User</th><th>IP</th><th>Device</th><th>Details</th></tr></thead>
                    <tbody id="logs"></tbody>
                </table>
            </section>
            <footer class="footer"><span id="pageInfo"></span><div><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div></footer>
        </main>
    </div>
    <script src="/js/auth-refresh.js"></script>
    <script src="/js/admin-logs.js"></script>
</body>
</html>
