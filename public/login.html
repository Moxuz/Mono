<!DOCTYPE html>
<html lang="en" class="dark">  <!-- ✅ เพิ่ม class="dark" เพื่อให้ default เป็น Dark Mode -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AuthSys</title>
    <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-box auth-box-login">
            <!-- Header -->
            <div class="auth-header">
                <h1>AuthSys</h1>
                <p>Identity Orchestration & Access Management</p>
            </div>

            <!-- Alert (Hidden by default) -->
            <div id="alert" class="alert" style="display: none;"></div>

            <!-- Social Login -->
            <div class="social-login">
                <!-- ✅ Google Login -->
                <a href="/api/auth/google" class="btn-social btn-google" id="googleLoginBtn">
                    <svg viewBox="0 0 18 18" width="18" height="18">
                        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
                        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
                        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
                    </svg>
                    Continue with Google
                </a>

                <!-- ✅ GitHub Login -->
                <a href="/api/auth/github" class="btn-social btn-github" id="githubLoginBtn">
                    <svg viewBox="0 0 16 16" width="18" height="18">
                        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    Continue with GitHub
                </a>
            </div>

            <div class="divider">IDENT_PROVIDER_LEGACY</div>

            <!-- Form -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email" class="input-label">Email Address</label>
                    <input type="email" id="email" name="email" class="input" placeholder="you@example.com" autocomplete="email" maxlength="254" autofocus required />
                </div>

                <div class="form-group">
                    <label for="password" class="input-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="input" placeholder="••••••••" autocomplete="current-password" maxlength="128" required />
                        <button type="button" class="password-toggle" data-input="password" data-icon="passwordIcon" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined" id="passwordIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="remember" name="remember" />
                        <span>Remember me</span>
                    </label>
                    <a href="/forgot-password.html">Recovery?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span>SIGN IN</span>
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>New operator? <a href="/register.html">Create account</a></p>
            </div>
        </div>
    </div>

    <!-- Cookie Banner -->
    <div id="cookieBanner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
        <div class="cookie-banner-content">
            <div class="cookie-banner-text">
                <span class="cookie-icon">🍪</span>
                <div>
                    <strong>COOKIE_LEDGER_NOTICE</strong>
                    <p>Essential cookies keep sign-in and security working. Analytics is optional. <a href="/privacy-policy.html" target="_blank">Read Terms & Privacy</a>.</p>
                </div>
            </div>
            <div class="cookie-banner-actions">
                <button class="btn-cookie-decline" type="button">Reject non-essential</button>
                <button class="btn-cookie-accept" type="button">Accept all</button>
            </div>
        </div>
    </div>

    <!-- ✅ Scripts -->
    <script src="/js/auth-refresh.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <!-- ✅ เพิ่ม OAuth Status Check -->
    <script src="/js/oauth-check.js"></script>
</body>
</html>
