<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Auth Monolith</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-brand">
                <h2>🔐 Auth System</h2>
            </div>
            <div class="nav-user">
                <span id="userName">Loading...</span>
                <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="dashboard-header">
                <h1>Welcome to Dashboard</h1>
                <p id="welcomeMessage">Loading...</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👤</div>
                    <div class="stat-info">
                        <h3>Profile</h3>
                        <p id="userEmail">-</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-info">
                        <h3>Role</h3>
                        <p id="userRole">-</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-info">
                        <h3>Member Since</h3>
                        <p id="memberSince">-</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <h3>Status</h3>
                        <p class="status-active">Active</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>📊 Quick Stats</h3>
                    <div class="card-content">
                        <div class="stat-row">
                            <span>Sessions</span>
                            <strong>1</strong>
                        </div>
                        <div class="stat-row">
                            <span>Last Login</span>
                            <strong id="lastLogin">Just now</strong>
                        </div>
                        <div class="stat-row">
                            <span>Security Level</span>
                            <strong class="text-success">High</strong>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>🔑 API Access</h3>
                    <div class="card-content">
                        <p>Your authentication token:</p>
                        <div class="token-box">
                            <code id="tokenDisplay">Loading...</code>
                            <button class="btn btn-sm" onclick="copyToken()">Copy</button>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>⚙️ Quick Actions</h3>
                    <div class="card-content">
                        <button class="btn btn-outline btn-block" onclick="refreshToken()">
                            🔄 Refresh Token
                        </button>
                        <button class="btn btn-outline btn-block" onclick="viewProfile()">
                            👤 View Profile
                        </button>
                        <button class="btn btn-outline btn-block" onclick="changePassword()">
                            🔒 Change Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = '/login.html';
        }

        // Load user data
        document.addEventListener('DOMContentLoaded', () => {
            if (user.username) {
                document.getElementById('userName').textContent = user.username;
                document.getElementById('welcomeMessage').textContent = `Hello, ${user.username}! 👋`;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userRole').textContent = user.role || 'user';
                document.getElementById('tokenDisplay').textContent = token.substring(0, 50) + '...';
                
                const date = new Date();
                document.getElementById('memberSince').textContent = date.toLocaleDateString();
            }
        });

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            }
        }

        function copyToken() {
            navigator.clipboard.writeText(token);
            alert('Token copied to clipboard!');
        }

        function refreshToken() {
            alert('Token refresh feature coming soon!');
        }

        function viewProfile() {
            alert('Profile page coming soon!');
        }

        function changePassword() {
            alert('Change password feature coming soon!');
        }
    </script>
</body>
</html>
