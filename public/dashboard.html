<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Auth System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="nav-brand">
                <h2>🔐 Auth System</h2>
            </div>
            <div class="nav-user">
                <span id="userName">Loading...</span>
                <button class="btn btn-secondary btn-sm" id="logoutBtn">Logout</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="dashboard-header">
                <h1>Welcome to Dashboard</h1>
                <p id="welcomeMessage">Loading...</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👤</div>
                    <div class="stat-info">
                        <h3>Profile</h3>
                        <p id="userEmail">-</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-info">
                        <h3>Role</h3>
                        <p id="userRole">-</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-info">
                        <h3>Member Since</h3>
                        <p id="memberSince">-</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <h3>Status</h3>
                        <p class="status-active">Active</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>📊 Quick Stats</h3>
                    <div class="card-content">
                        <div class="stat-row">
                            <span>Sessions</span>
                            <strong>1</strong>
                        </div>
                        <div class="stat-row">
                            <span>Last Login</span>
                            <strong id="lastLogin">Just now</strong>
                        </div>
                        <div class="stat-row">
                            <span>Security Level</span>
                            <strong class="text-success">High</strong>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>🔑 API Access</h3>
                    <div class="card-content">
                        <p>Your authentication token:</p>
                        <div class="token-box">
                            <code id="tokenDisplay">Loading...</code>
                            <button class="btn btn-sm" id="copyTokenBtn">Copy</button>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>⚙️ Quick Actions</h3>
                    <div class="card-content">
                        <button class="btn btn-outline btn-block" id="testTokenBtn">
                            🧪 Test Token
                        </button>
                        <button class="btn btn-outline btn-block" id="devPortalBtn">
                            🔧 Developer Portal
                        </button>
                        <button class="btn btn-outline btn-block" id="viewProfileBtn">
                            👤 View Profile
                        </button>
                        <button class="btn btn-outline btn-block" id="changePasswordBtn">
                            🔒 Change Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        console.log('Dashboard loaded');
        console.log('Token exists:', !!token);
        console.log('User:', user);

        if (!token) {
            console.log('No token found, redirecting to login');
            window.location.href = '/login.html';
        }

        // Load user data
        if (user.username) {
            document.getElementById('userName').textContent = user.username;
            document.getElementById('welcomeMessage').textContent = `Hello, ${user.username}! 👋`;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userRole').textContent = user.role || 'user';
            
            if (token) {
                document.getElementById('tokenDisplay').textContent = token.substring(0, 50) + '...';
            }
            
            const date = new Date();
            document.getElementById('memberSince').textContent = date.toLocaleDateString();
        }

        // Event Listeners
        document.getElementById('logoutBtn').addEventListener('click', function() {
            console.log('Logout clicked');
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            }
        });

        document.getElementById('copyTokenBtn').addEventListener('click', function() {
            console.log('Copy token clicked');
            navigator.clipboard.writeText(token);
            this.textContent = 'Copied!';
            setTimeout(() => {
                this.textContent = 'Copy';
            }, 2000);
        });

        document.getElementById('testTokenBtn').addEventListener('click', function() {
            console.log('Test token clicked');
            window.location.href = '/test-token.html';
        });

        document.getElementById('devPortalBtn').addEventListener('click', function() {
            console.log('Developer portal clicked');
            window.location.href = '/developer-portal.html';
        });

        document.getElementById('viewProfileBtn').addEventListener('click', function() {
            console.log('View profile clicked');
            alert('Profile page coming soon!');
        });

        document.getElementById('changePasswordBtn').addEventListener('click', function() {
            console.log('Change password clicked');
            window.location.href = '/forgot-password.html';
        });

        console.log('✅ All event listeners attached');
    </script>
</body>
</html>
