# AuthSys local fallback
# Plain HTTP, loopback-bound ports, isolated network and volumes.
# Run from this folder with:
# docker compose --project-name authsys-local --env-file .env -f docker-compose.local.yml up -d --build

x-auth-env: &auth-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 5000
  JWT_SECRET: \
  SESSION_SECRET: \
  CSRF_SECRET: \
  MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-local_mongo_password}@mongodb:27017/authdb?authSource=admin"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1500}
  REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
  USE_REDIS_SESSIONS: ${USE_REDIS_SESSIONS:-true}
  BASE_URL: ${BASE_URL:-http://localhost:8080}
  AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://localhost:8080}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8080/api/auth/github/callback}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3001,http://localhost:3002,http://localhost:8080}"
  RATE_LIMIT_WHITELIST: "${RATE_LIMIT_WHITELIST:-127.0.0.1,::1,::ffff:127.0.0.1}"
  USE_KAFKA_LOGGING: ${USE_KAFKA_LOGGING:-false}
  KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
  KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-authsys-local}
  KAFKA_CONNECT_TIMEOUT_MS: ${KAFKA_CONNECT_TIMEOUT_MS:-2000}
  KAFKA_RETRIES: ${KAFKA_RETRIES:-1}

services:
  auth:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *auth-env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth-local
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${AUTH_PORT:-8080}:80"
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - auth-local
    restart: unless-stopped

  mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local_mongo_password}
      MONGO_INITDB_DATABASE: authdb
    volumes:
      - mongo-data:/data/db
    networks:
      - auth-local
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - redis-data:/data
    networks:
      - auth-local
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 10s
      timeout: 5s
      retries: 5

  client1:
    build:
      context: ../..
      dockerfile: Dockerfile.client
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      APP_NAME: ${CLIENT_APP_NAME:-ShopHub Client App 1}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REDIRECT_URI: ${CLIENT_REDIRECT_URI:-http://localhost:3001/callback}
      OAUTH_PROVIDER: http://proxy
      OAUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:8080}
      SESSION_SECRET: ${CLIENT_SESSION_SECRET:-local-client-1-session-secret-change-me-32}
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-local_mongo_password}@mongodb:27017/authdb?authSource=admin"
      COOKIE_SECURE: ${CLIENT_COOKIE_SECURE:-false}
    depends_on:
      proxy:
        condition: service_started
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLIENT1_PORT:-3001}:3001"
    networks:
      - auth-local
    restart: unless-stopped

  client2:
    build:
      context: ../..
      dockerfile: Dockerfile.client
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      APP_NAME: ${CLIENT2_APP_NAME:-Workspace Client 2}
      CLIENT_ID: ${CLIENT2_ID:-}
      CLIENT_SECRET: ${CLIENT2_SECRET:-}
      REDIRECT_URI: ${CLIENT2_REDIRECT_URI:-http://localhost:3002/callback}
      OAUTH_PROVIDER: http://proxy
      OAUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:8080}
      SESSION_SECRET: ${CLIENT2_SESSION_SECRET:-local-client-2-session-secret-change-me-32}
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-local_mongo_password}@mongodb:27017/authdb?authSource=admin"
      COOKIE_SECURE: ${CLIENT2_COOKIE_SECURE:-false}
    depends_on:
      proxy:
        condition: service_started
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLIENT2_PORT:-3002}:3002"
    networks:
      - auth-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - auth-local
    restart: unless-stopped

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - auth-local
    restart: unless-stopped

networks:
  auth-local:
    name: authsys-local-network
    driver: bridge

volumes:
  mongo-data:
    name: authsys-local-fallback-mongo-data
  redis-data:
    name: authsys-local-fallback-redis-data
  zookeeper-data:
    name: authsys-local-fallback-zookeeper-data
  zookeeper-logs:
    name: authsys-local-fallback-zookeeper-logs
  kafka-data:
    name: authsys-local-fallback-kafka-data
