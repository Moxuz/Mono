# Local-only HTTP proxy for the AuthSys fallback stack.
# No TLS, certificate, DuckDNS, or VPS settings belong in this file.

upstream auth_local_backend {
    server auth:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 _;
    client_max_body_size 10k;

    server_tokens off;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Connection "";

    proxy_connect_timeout  5s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    location = /health {
        proxy_pass http://auth_local_backend;
        access_log off;
    }

    location / {
        proxy_pass http://auth_local_backend;
    }
}
