# ─────────────────────────────────────────────────────────────────────────────
# Nginx Load Balancer — TAS Authentication Server
# 3 app instances: auth-app-1, auth-app-2, auth-app-3
# ip_hash: sticky routing for WebSocket connections + OAuth state consistency
# ─────────────────────────────────────────────────────────────────────────────

upstream auth_backend {
    ip_hash;                    # sticky: same client IP → same instance
    server auth-app-1:5000;
    server auth-app-2:5000;
    server auth-app-3:5000;
    keepalive 32;               # keep connections warm
}

server {
    listen 80;
    server_name _;

    # ── Proxy headers (required for express trust proxy + rate-limit IP) ──────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── WebSocket upgrade passthrough ────────────────────────────────────────
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ── Timeouts ─────────────────────────────────────────────────────────────
    proxy_connect_timeout  5s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ── Buffer tuning ────────────────────────────────────────────────────────
    proxy_buffering    on;
    proxy_buffer_size  4k;
    proxy_buffers      8 4k;

    # ── Health check endpoint (load balancer probes) ─────────────────────────
    location /health {
        proxy_pass http://auth_backend;
        access_log off;         # suppress health-check log noise
    }

    # ── All other traffic (API + WebSocket + static) ─────────────────────────
    location / {
        proxy_pass http://auth_backend;
    }
}
