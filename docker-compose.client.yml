# ─────────────────────────────────────────────────────────────────────────────
# Client App 1 - ShopHub E-commerce
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   Start:     docker-compose -f docker-compose.client.yml up -d
#   Stop:      docker-compose -f docker-compose.client.yml down
#   Logs:      docker-compose -f docker-compose.client.yml logs -f
#
# This creates:
#   - Client App 1 and Client App 2 OAuth relying parties
#   - A dedicated Redis instance for their server-side sessions
#
# Prerequisites:
#   - Auth server must be running first (docker-compose up -d in main folder)
#   - OAuth client must be registered in auth server developer portal
# ─────────────────────────────────────────────────────────────────────────────

x-client-logging: &client-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Client sessions are intentionally isolated from the AuthSys Redis and
  # MongoDB. The relying parties never receive AuthSys database credentials.
  client-session-redis:
    image: redis:7-alpine
    container_name: auth-client-redis
    environment:
      CLIENT_REDIS_PASSWORD: ${CLIENT_REDIS_PASSWORD:?Set CLIENT_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 64mb
        --maxmemory-policy noeviction --requirepass "$$CLIENT_REDIS_PASSWORD"
    volumes:
      - client-session-redis-data:/data
    networks:
      - client-network
    restart: unless-stopped
    logging: *client-logging
    mem_limit: 128m
    cpus: "0.15"
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$CLIENT_REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Client App 1 (ShopHub E-commerce) ─────────────────────────────────────
  client-app-1:
    build:
      context: ./cLient-app-1
      dockerfile: ../Dockerfile.client
    container_name: shophub-client
    # Keep direct access local-only. Production traffic should enter through
    # the reverse proxy on the shared Docker network.
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      APP_NAME: ${CLIENT_APP_NAME:-ShopHub Client App 1}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REDIRECT_URI: ${CLIENT_REDIRECT_URI:-http://localhost:3001/callback}
      # Internal HTTP endpoint avoids the public HTTPS certificate/redirect path
      # when the client exchanges an authorization code server-to-server.
      OAUTH_PROVIDER: ${OAUTH_PROVIDER_INTERNAL:-http://nginx}
      OAUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost}
      SESSION_SECRET: ${CLIENT_SESSION_SECRET:-}
      USE_REDIS_SESSIONS: "true"
      REDIS_HOST: client-session-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${CLIENT_REDIS_PASSWORD:?Set CLIENT_REDIS_PASSWORD}
      COOKIE_SECURE: ${CLIENT_COOKIE_SECURE:-false}
    depends_on:
      client-session-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - client-network
    restart: unless-stopped
    logging: *client-logging
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Client App 2 (Workspace OAuth mockup) ────────────────────────────────
  client-app-2:
    build:
      context: ./client-2
      dockerfile: ../Dockerfile.client
    container_name: workspace-client-2
    # Client-2 credentials are intentionally optional on a server that only
    # runs client-1. Supply client-2/.env before enabling that mockup.
    env_file:
      - path: ./client-2/.env
        required: false
    ports:
      - "127.0.0.1:${CLIENT2_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      APP_NAME: ${CLIENT2_APP_NAME:-Workspace Client 2}
      OAUTH_PROVIDER: ${CLIENT2_OAUTH_PROVIDER_INTERNAL:-http://nginx}
      OAUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost}
      COOKIE_SECURE: ${CLIENT2_COOKIE_SECURE:-false}
      USE_REDIS_SESSIONS: "true"
      REDIS_HOST: client-session-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${CLIENT_REDIS_PASSWORD:?Set CLIENT_REDIS_PASSWORD}
    depends_on:
      client-session-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - client-network
    restart: unless-stopped
    logging: *client-logging
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Auth Server Reference (for dependency) ────────────────────────────────
  # Note: This is just a reference. Auth server should run separately.
  # Uncomment if you want to start everything together:
  #
  # auth-server:
  #   image: auth-monolith:latest
  #   container_name: auth-server
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=5000
  #   networks:
  #     - client-network
  #   restart: unless-stopped

networks:
  client-network:
    driver: bridge
    name: ${CLIENT_NETWORK_NAME:-client-network}

volumes:
  client-session-redis-data:
