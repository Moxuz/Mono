# ─────────────────────────────────────────────────────────────────────────────
# Client App 1 - ShopHub E-commerce
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   Start:     docker-compose -f docker-compose.client.yml up -d
#   Stop:      docker-compose -f docker-compose.client.yml down
#   Logs:      docker-compose -f docker-compose.client.yml logs -f
#
# This creates:
#   - Client App 1 (ShopHub E-commerce with OAuth SSO)
#
# Prerequisites:
#   - Auth server must be running first (docker-compose up -d in main folder)
#   - OAuth client must be registered in auth server developer portal
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Client App 1 (ShopHub E-commerce) ─────────────────────────────────────
  client-app-1:
    build:
      context: ./cLient-app-1
      dockerfile: ../Dockerfile.client
    container_name: shophub-client
    # Keep direct access local-only. Production traffic should enter through
    # the reverse proxy on the shared Docker network.
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      APP_NAME: ${CLIENT_APP_NAME:-ShopHub Client App 1}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REDIRECT_URI: ${CLIENT_REDIRECT_URI:-http://localhost:3001/callback}
      # Internal HTTP endpoint avoids the public HTTPS certificate/redirect path
      # when the client exchanges an authorization code server-to-server.
      OAUTH_PROVIDER: ${OAUTH_PROVIDER_INTERNAL:-http://nginx}
      OAUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost}
      SESSION_SECRET: ${CLIENT_SESSION_SECRET:-}
      MONGODB_URI: ${CLIENT_MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change_me}@mongodb:27017/authdb?authSource=admin}
      COOKIE_SECURE: ${CLIENT_COOKIE_SECURE:-false}
    # Note: Auth server must be running separately
    # Remove depends_on if auth server is already running
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - client-network
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/session"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Client App 2 (Workspace OAuth mockup) ────────────────────────────────
  client-app-2:
    build:
      context: ./client-2
      dockerfile: ../Dockerfile.client
    container_name: workspace-client-2
    # Client-2 credentials are intentionally optional on a server that only
    # runs client-1. Supply client-2/.env before enabling that mockup.
    env_file:
      - path: ./client-2/.env
        required: false
    ports:
      - "127.0.0.1:${CLIENT2_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      APP_NAME: ${CLIENT2_APP_NAME:-Workspace Client 2}
      OAUTH_PROVIDER: ${CLIENT2_OAUTH_PROVIDER_INTERNAL:-http://nginx}
      OAUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost}
      SESSION_SECRET: ${CLIENT2_SESSION_SECRET:-}
      COOKIE_SECURE: ${CLIENT2_COOKIE_SECURE:-false}
      MONGODB_URI: ${CLIENT2_MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change_me}@mongodb:27017/authdb?authSource=admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - client-network
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Auth Server Reference (for dependency) ────────────────────────────────
  # Note: This is just a reference. Auth server should run separately.
  # Uncomment if you want to start everything together:
  #
  # auth-server:
  #   image: auth-monolith:latest
  #   container_name: auth-server
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=5000
  #   networks:
  #     - client-network
  #   restart: unless-stopped

networks:
  client-network:
    driver: bridge
    name: ${CLIENT_NETWORK_NAME:-client-network}
  auth-network:
    external: true
    name: ${AUTH_NETWORK_NAME:-auth-network}

# Volumes (optional - for persistent data if needed)
# volumes:
#   client-data:
